<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <!-- Mobile viewport for Neocities and small screens -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta
    name="description"
    content="A fantasy RPG world atlas, character codex, travel guide, and visual novel encyclopedia."
  >

  <title>Chronicles of Aetheria — World Atlas &amp; Codex</title>

  <style>
    /* =========================================================
       1. EASY THEME CONTROLS
       Change these variables to recolor the entire page.
       ========================================================= */

    :root {
      --ink: #24170f;
      --ink-soft: #4b3424;
      --ink-muted: #705640;

      --parchment: #d9bc82;
      --parchment-light: #f1dfb1;
      --parchment-pale: #f7ebc8;
      --parchment-dark: #a4773d;

      --wood: #4b2e1d;
      --wood-dark: #24140d;
      --wood-light: #765033;

      --gold: #b88a39;
      --gold-bright: #e1bd68;
      --gold-dark: #6d4a19;

      --ruby: #7a2c25;
      --ruby-dark: #3d1715;

      --emerald: #35543d;
      --emerald-dark: #1c3023;

      --sapphire: #294a65;
      --sapphire-dark: #172d3d;

      --violet: #4b3b66;
      --violet-dark: #282038;

      --shadow: rgba(29, 15, 7, 0.35);
      --shadow-heavy: rgba(20, 10, 5, 0.58);

      --border-thin: 1px;
      --border-medium: 3px;
      --border-heavy: 6px;

      --radius-small: 4px;
      --radius-medium: 10px;
      --radius-large: 18px;

      --content-width: 1500px;
      --nav-height: 66px;

      --transition-fast: 160ms ease;
      --transition-medium: 320ms ease;
    }

    /* =========================================================
       2. BASE RESET AND DOCUMENT STYLING
       ========================================================= */

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
      scroll-padding-top: calc(var(--nav-height) + 18px);
    }

    body {
      margin: 0;
      min-width: 320px;
      color: var(--ink);
      background:
        radial-gradient(circle at 15% 20%, rgba(255,255,255,0.08), transparent 20%),
        radial-gradient(circle at 85% 80%, rgba(0,0,0,0.13), transparent 28%),
        repeating-linear-gradient(
          0deg,
          rgba(255,255,255,0.018) 0,
          rgba(255,255,255,0.018) 1px,
          rgba(0,0,0,0.02) 1px,
          rgba(0,0,0,0.02) 3px
        ),
        #2b1b12;
      font-family: Georgia, "Times New Roman", serif;
      line-height: 1.55;
      overflow-x: hidden;
    }

    img {
      display: block;
      max-width: 100%;
    }

    a {
      color: inherit;
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    ::selection {
      color: var(--parchment-pale);
      background: var(--ruby);
    }

    /* Skip link for keyboard and screen reader users */
    .skip-link {
      position: fixed;
      top: 10px;
      left: 10px;
      z-index: 9999;
      padding: 0.75rem 1rem;
      color: #fff;
      background: #111;
      border-radius: var(--radius-small);
      transform: translateY(-150%);
      transition: transform var(--transition-fast);
    }

    .skip-link:focus {
      transform: translateY(0);
    }

    /* =========================================================
       3. REUSABLE TYPOGRAPHY
       ========================================================= */

    h1,
    h2,
    h3,
    h4 {
      margin-top: 0;
      line-height: 1.08;
      letter-spacing: 0.035em;
    }

    h1,
    h2 {
      font-family: "Palatino Linotype", Palatino, Georgia, serif;
      text-transform: uppercase;
    }

    p {
      margin-top: 0;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.65rem;
      color: var(--ruby-dark);
      font-size: 0.76rem;
      font-weight: 800;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    .eyebrow::before,
    .eyebrow::after {
      content: "";
      width: 22px;
      height: 1px;
      background: currentColor;
      opacity: 0.7;
    }

    .section-title {
      margin-bottom: 0.7rem;
      font-size: clamp(1.75rem, 4vw, 3.5rem);
      color: var(--wood-dark);
      text-align: center;
      text-shadow: 0 1px 0 rgba(255,255,255,0.45);
    }

    .section-intro {
      width: min(780px, 100%);
      margin: 0 auto 2rem;
      color: var(--ink-soft);
      text-align: center;
      font-size: 1.04rem;
    }

    .small-caps {
      font-variant: small-caps;
      letter-spacing: 0.06em;
    }

    /* =========================================================
       4. PAGE SHELL AND PARCHMENT SURFACE
       ========================================================= */

    .page-shell {
      width: min(var(--content-width), calc(100% - 22px));
      margin: 12px auto;
      background:
        linear-gradient(rgba(244, 225, 177, 0.88), rgba(218, 187, 126, 0.88)),
        url("https://files.catbox.moe/example.jpg") center / cover fixed;
      border: var(--border-heavy) double var(--wood-dark);
      box-shadow:
        0 18px 50px var(--shadow-heavy),
        inset 0 0 80px rgba(74, 41, 20, 0.22);
      position: relative;
      isolation: isolate;
    }

    .page-shell::before,
    .page-shell::after {
      content: "✦";
      position: absolute;
      z-index: 10;
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      color: var(--gold-dark);
      background: var(--parchment-light);
      border: 2px solid var(--wood-dark);
      border-radius: 50%;
      font-size: 1rem;
      box-shadow: inset 0 0 0 3px rgba(184, 138, 57, 0.35);
    }

    .page-shell::before {
      top: 5px;
      left: 5px;
    }

    .page-shell::after {
      right: 5px;
      bottom: 5px;
    }

    main {
      padding: clamp(12px, 2vw, 28px);
    }

    .section {
      margin: clamp(28px, 6vw, 84px) 0;
      scroll-margin-top: calc(var(--nav-height) + 20px);
    }

    /* =========================================================
       5. DECORATIVE PANELS AND CARD SYSTEM
       ========================================================= */

    .ornate-panel,
    .card {
      position: relative;
      color: var(--ink);
      background:
        linear-gradient(135deg, rgba(255,255,255,0.28), transparent 38%),
        linear-gradient(rgba(242, 224, 178, 0.96), rgba(213, 178, 111, 0.94));
      border: var(--border-medium) double var(--wood-dark);
      box-shadow:
        0 8px 18px var(--shadow),
        inset 0 0 24px rgba(100, 58, 24, 0.14);
    }

    .ornate-panel::before,
    .ornate-panel::after,
    .card::before,
    .card::after {
      content: "◆";
      position: absolute;
      z-index: 2;
      color: var(--gold-dark);
      font-size: 0.78rem;
      line-height: 1;
    }

    .ornate-panel::before,
    .card::before {
      top: 4px;
      left: 5px;
    }

    .ornate-panel::after,
    .card::after {
      right: 5px;
      bottom: 4px;
    }

    .panel-padding {
      padding: clamp(18px, 3vw, 32px);
    }

    .card {
      padding: 1rem;
      border-width: 2px;
      transition:
        transform var(--transition-medium),
        box-shadow var(--transition-medium),
        border-color var(--transition-medium);
    }

    .card:hover {
      transform: translateY(-5px);
      border-color: var(--gold-dark);
      box-shadow:
        0 15px 26px rgba(34, 18, 9, 0.32),
        inset 0 0 22px rgba(184, 138, 57, 0.18);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.3rem 0.65rem;
      color: var(--parchment-pale);
      background: var(--wood);
      border: 1px solid var(--gold);
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 0.85rem;
      margin: clamp(34px, 6vw, 72px) 0;
      color: var(--gold-dark);
    }

    .divider::before,
    .divider::after {
      content: "";
      flex: 1;
      height: 6px;
      background:
        linear-gradient(
          to bottom,
          transparent 0 1px,
          var(--wood-dark) 1px 2px,
          transparent 2px 4px,
          var(--gold-dark) 4px 5px,
          transparent 5px
        );
    }

    .divider span {
      display: inline-grid;
      place-items: center;
      width: 42px;
      height: 42px;
      border: 2px solid var(--wood-dark);
      border-radius: 50%;
      background: var(--parchment-light);
      box-shadow: inset 0 0 0 4px rgba(184, 138, 57, 0.2);
    }

    /* =========================================================
       6. STICKY RPG NAVIGATION
       ========================================================= */

    .site-nav {
      position: sticky;
      top: 0;
      z-index: 100;
      min-height: var(--nav-height);
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 0.55rem clamp(0.75rem, 2vw, 1.5rem);
      color: var(--parchment-pale);
      background:
        linear-gradient(rgba(40, 23, 14, 0.96), rgba(61, 37, 22, 0.96)),
        url("https://files.catbox.moe/example.jpg") center / cover;
      border-bottom: 4px double var(--gold-dark);
      box-shadow: 0 4px 14px rgba(17, 9, 4, 0.48);
    }

    .nav-brand {
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      gap: 0.65rem;
      color: var(--gold-bright);
      font-weight: 800;
      letter-spacing: 0.08em;
      text-decoration: none;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .nav-brand-mark {
      display: grid;
      place-items: center;
      width: 38px;
      height: 38px;
      border: 2px solid var(--gold);
      border-radius: 50%;
      background: var(--wood-dark);
      box-shadow: inset 0 0 0 4px rgba(225, 189, 104, 0.08);
    }

    .nav-links {
      display: flex;
      flex: 1;
      gap: 0.45rem;
      overflow-x: auto;
      scrollbar-width: thin;
      scrollbar-color: var(--gold-dark) transparent;
    }

    .nav-links a {
      flex: 0 0 auto;
      padding: 0.55rem 0.78rem;
      border: 1px solid transparent;
      border-radius: var(--radius-small);
      color: var(--parchment-light);
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-decoration: none;
      text-transform: uppercase;
      transition:
        color var(--transition-fast),
        background var(--transition-fast),
        border-color var(--transition-fast);
    }

    .nav-links a:hover,
    .nav-links a:focus-visible {
      color: var(--gold-bright);
      background: rgba(255,255,255,0.06);
      border-color: rgba(225,189,104,0.45);
      outline: none;
    }

    /* =========================================================
       7. HERO / LARGE TITLE AREA
       ========================================================= */

    .hero {
      position: relative;
      min-height: clamp(540px, 78vh, 860px);
      display: grid;
      place-items: center;
      overflow: hidden;
      border-bottom: var(--border-heavy) double var(--wood-dark);
      background:
        linear-gradient(
          to bottom,
          rgba(16, 22, 24, 0.22),
          rgba(26, 17, 10, 0.68)
        ),
        url("https://files.catbox.moe/example.jpg") center / cover;
      isolation: isolate;
    }

    .hero::before {
      content: "";
      position: absolute;
      inset: 18px;
      z-index: -1;
      border: 2px solid rgba(238, 207, 132, 0.78);
      outline: 1px solid rgba(44, 24, 13, 0.92);
      outline-offset: 5px;
      pointer-events: none;
    }

    .hero::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -2;
      background:
        radial-gradient(circle at center, transparent 25%, rgba(21, 12, 7, 0.5) 100%);
    }

    .hero-content {
      width: min(980px, calc(100% - 40px));
      padding: clamp(2rem, 5vw, 5rem) 1rem;
      text-align: center;
      color: var(--parchment-pale);
      animation: hero-rise 850ms ease-out both;
    }

    .hero-crest {
      width: 94px;
      height: 94px;
      display: grid;
      place-items: center;
      margin: 0 auto 1rem;
      color: var(--gold-bright);
      background: rgba(31, 18, 10, 0.72);
      border: 4px double var(--gold);
      border-radius: 50%;
      box-shadow:
        0 0 0 6px rgba(26, 14, 8, 0.42),
        0 12px 28px rgba(0,0,0,0.35);
      font-size: 2rem;
    }

    .hero-kicker {
      margin-bottom: 0.8rem;
      color: var(--gold-bright);
      font-size: clamp(0.72rem, 1.8vw, 1rem);
      font-weight: 800;
      letter-spacing: 0.3em;
      text-transform: uppercase;
    }

    .hero h1 {
      margin-bottom: 0.55rem;
      color: #f8e5b4;
      font-size: clamp(3rem, 9vw, 8.5rem);
      letter-spacing: 0.01em;
      text-shadow:
        0 3px 0 var(--wood-dark),
        0 7px 18px rgba(0,0,0,0.66);
    }

    .hero-subtitle {
      display: inline-block;
      margin-bottom: 1rem;
      padding: 0.55rem 1.6rem;
      color: var(--wood-dark);
      background:
        linear-gradient(var(--parchment-light), var(--parchment));
      border: 4px double var(--wood-dark);
      box-shadow: 0 8px 16px rgba(0,0,0,0.35);
      font-size: clamp(1rem, 3vw, 1.8rem);
      font-weight: 800;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      transform: rotate(-1deg);
    }

    .hero-description {
      width: min(760px, 100%);
      margin: 0 auto 1.5rem;
      font-size: clamp(1rem, 2.1vw, 1.22rem);
      text-shadow: 0 2px 8px rgba(0,0,0,0.65);
    }

    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.8rem;
    }

    .rpg-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      padding: 0.7rem 1.1rem;
      color: var(--parchment-pale);
      background:
        linear-gradient(var(--wood-light), var(--wood));
      border: 3px double var(--gold);
      border-radius: var(--radius-small);
      box-shadow:
        0 5px 0 var(--wood-dark),
        0 10px 20px rgba(0,0,0,0.25);
      font-weight: 800;
      letter-spacing: 0.07em;
      text-decoration: none;
      text-transform: uppercase;
      transition:
        transform var(--transition-fast),
        filter var(--transition-fast),
        box-shadow var(--transition-fast);
    }

    .rpg-button:hover,
    .rpg-button:focus-visible {
      transform: translateY(-2px);
      filter: brightness(1.12);
      box-shadow:
        0 7px 0 var(--wood-dark),
        0 13px 22px rgba(0,0,0,0.3);
      outline: none;
    }

    .rpg-button.secondary {
      color: var(--wood-dark);
      background: linear-gradient(var(--parchment-pale), var(--parchment));
      border-color: var(--wood-dark);
    }

    @keyframes hero-rise {
      from {
        opacity: 0;
        transform: translateY(24px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* =========================================================
       8. OVERVIEW PANEL
       ========================================================= */

    .overview-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.35fr) minmax(280px, 0.65fr);
      gap: 1.2rem;
    }

    .overview-copy {
      padding: clamp(1.2rem, 3vw, 2.2rem);
    }

    .overview-copy h2 {
      margin-bottom: 0.8rem;
      font-size: clamp(1.9rem, 4vw, 3.2rem);
    }

    .overview-stats {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 0.75rem;
      margin-top: 1.4rem;
    }

    .stat {
      padding: 0.85rem;
      text-align: center;
      background: rgba(255,255,255,0.24);
      border: 1px solid rgba(75, 46, 29, 0.5);
      box-shadow: inset 0 0 12px rgba(88, 51, 23, 0.1);
    }

    .stat strong {
      display: block;
      color: var(--ruby-dark);
      font-size: clamp(1.4rem, 3vw, 2.1rem);
      line-height: 1;
    }

    .stat span {
      display: block;
      margin-top: 0.35rem;
      color: var(--ink-soft);
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .overview-art {
      position: relative;
      min-height: 360px;
      overflow: hidden;
      border-left: 3px double var(--wood-dark);
    }

    .overview-art img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: sepia(0.18) contrast(1.04);
      transition: transform 700ms ease;
    }

    .overview-art:hover img {
      transform: scale(1.04);
    }

    .overview-art figcaption {
      position: absolute;
      right: 1rem;
      bottom: 1rem;
      left: 1rem;
      padding: 0.75rem;
      color: var(--parchment-pale);
      background: rgba(35, 20, 11, 0.82);
      border: 1px solid var(--gold);
      font-size: 0.85rem;
      text-align: center;
    }

    /* =========================================================
       9. WORLD MAP AND POSITIONED LABELS
       ========================================================= */

    .atlas-layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 310px;
      gap: 1.2rem;
      align-items: start;
    }

    .map-frame {
      position: relative;
      min-height: 760px;
      overflow: hidden;
      background: var(--sapphire-dark);
      border: var(--border-heavy) double var(--wood-dark);
      box-shadow:
        0 12px 26px var(--shadow),
        inset 0 0 40px rgba(0,0,0,0.28);
    }

    .map-frame::before {
      content: "";
      position: absolute;
      inset: 10px;
      z-index: 4;
      border: 2px solid rgba(239, 208, 134, 0.7);
      pointer-events: none;
    }

    .map-image {
      width: 100%;
      height: 100%;
      min-height: 760px;
      object-fit: cover;
      filter: sepia(0.14) saturate(0.85) contrast(1.06);
      transition: transform 1200ms ease;
    }

    .map-frame:hover .map-image {
      transform: scale(1.018);
    }

    .map-label {
      position: absolute;
      z-index: 5;
      transform: translate(-50%, -50%);
      padding: 0.35rem 0.58rem;
      color: var(--parchment-pale);
      background: rgba(38, 21, 12, 0.9);
      border: 2px solid var(--gold);
      border-radius: 3px;
      box-shadow:
        0 4px 10px rgba(0,0,0,0.35),
        inset 0 0 8px rgba(225,189,104,0.08);
      font-size: clamp(0.66rem, 1.15vw, 0.9rem);
      font-weight: 800;
      letter-spacing: 0.02em;
      white-space: nowrap;
      cursor: default;
      transition:
        transform var(--transition-fast),
        color var(--transition-fast),
        background var(--transition-fast);
    }

    .map-label::after {
      content: "";
      position: absolute;
      top: 100%;
      left: 50%;
      width: 2px;
      height: 12px;
      background: var(--gold);
      transform: translateX(-50%);
    }

    .map-label:hover,
    .map-label:focus-visible {
      color: var(--wood-dark);
      background: var(--gold-bright);
      transform: translate(-50%, -50%) scale(1.08);
      outline: 2px solid var(--parchment-pale);
      outline-offset: 2px;
    }

    /* Edit these percentage coordinates to reposition map labels */
    .label-aurelia { top: 22%; left: 34%; }
    .label-stormhold { top: 15%; left: 67%; }
    .label-blackmere { top: 39%; left: 77%; }
    .label-verdant { top: 52%; left: 58%; }
    .label-cindervale { top: 61%; left: 28%; }
    .label-moonharbor { top: 76%; left: 42%; }
    .label-frostspire { top: 85%; left: 68%; }
    .label-sunreach { top: 43%; left: 18%; }

    .side-panel {
      position: sticky;
      top: calc(var(--nav-height) + 16px);
      padding: 1.1rem;
    }

    .side-panel h3 {
      padding-bottom: 0.6rem;
      border-bottom: 3px double var(--wood-dark);
      font-size: 1.45rem;
      text-align: center;
      text-transform: uppercase;
    }

    .faction-list,
    .legend-list,
    .travel-list {
      display: grid;
      gap: 0.8rem;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .faction-item,
    .legend-item {
      display: grid;
      grid-template-columns: 42px 1fr;
      gap: 0.75rem;
      align-items: center;
      padding: 0.65rem;
      background: rgba(255,255,255,0.2);
      border: 1px solid rgba(58, 34, 19, 0.42);
    }

    .faction-emblem,
    .legend-icon {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      color: var(--parchment-pale);
      background: var(--wood);
      border: 2px solid var(--gold);
      border-radius: 50%;
      font-weight: 900;
    }

    .faction-item strong,
    .legend-item strong {
      display: block;
      line-height: 1.1;
    }

    .faction-item small,
    .legend-item small {
      color: var(--ink-muted);
    }

    .side-rule {
      height: 1px;
      margin: 1.15rem 0;
      background: linear-gradient(to right, transparent, var(--wood-dark), transparent);
    }

    /* =========================================================
       10. SOCIAL LOCATIONS / ILLUSTRATED CARDS
       ========================================================= */

    .location-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 1rem;
    }

    .location-card {
      overflow: hidden;
      padding: 0;
    }

    .location-card figure {
      position: relative;
      margin: 0;
      overflow: hidden;
      aspect-ratio: 4 / 3;
      border-bottom: 3px double var(--wood-dark);
    }

    .location-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: sepia(0.18) saturate(0.85);
      transition:
        transform 650ms ease,
        filter 650ms ease;
    }

    .location-card:hover img {
      transform: scale(1.08);
      filter: sepia(0.02) saturate(1.05);
    }

    .location-rank {
      position: absolute;
      top: 0.7rem;
      left: 0.7rem;
      display: grid;
      place-items: center;
      width: 42px;
      height: 42px;
      color: var(--parchment-pale);
      background: var(--ruby-dark);
      border: 3px double var(--gold);
      border-radius: 50% 50% 50% 12%;
      font-size: 1.15rem;
      font-weight: 900;
    }

    .location-copy {
      padding: 1rem;
    }

    .location-copy h3 {
      margin-bottom: 0.4rem;
      font-size: 1.25rem;
    }

    .tag-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      margin-top: 0.75rem;
    }

    .tag {
      padding: 0.2rem 0.5rem;
      color: var(--ink-soft);
      background: rgba(255,255,255,0.28);
      border: 1px solid rgba(75,46,29,0.4);
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
    }

    /* =========================================================
       11. CHARACTER GALLERY
       ========================================================= */

    .character-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 1rem;
    }

    .character-card {
      padding: 0;
      overflow: hidden;
      text-align: center;
    }

    .portrait-frame {
      position: relative;
      overflow: hidden;
      aspect-ratio: 4 / 5;
      background: var(--wood-dark);
      border-bottom: 3px double var(--wood-dark);
    }

    .portrait-frame::after {
      content: "";
      position: absolute;
      inset: 8px;
      border: 1px solid rgba(238, 207, 132, 0.72);
      pointer-events: none;
    }

    .portrait-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: sepia(0.14) contrast(1.02);
      transition:
        transform 600ms ease,
        filter 600ms ease;
    }

    .character-card:hover img {
      transform: scale(1.07);
      filter: sepia(0) contrast(1.06);
    }

    .character-copy {
      padding: 0.9rem;
    }

    .character-copy h3 {
      margin-bottom: 0.25rem;
      font-size: 1.1rem;
    }

    .character-role {
      color: var(--ruby-dark);
      font-size: 0.74rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .affinity {
      display: flex;
      justify-content: center;
      gap: 0.22rem;
      margin-top: 0.55rem;
      color: var(--gold-dark);
      letter-spacing: 0.05em;
    }

    /* =========================================================
       12. FEATURED CHARACTER PANEL
       ========================================================= */

    .featured-character {
      display: grid;
      grid-template-columns: minmax(280px, 0.78fr) minmax(0, 1.22fr);
      min-height: 600px;
      overflow: hidden;
    }

    .featured-art {
      position: relative;
      min-height: 520px;
      background: var(--wood-dark);
      border-right: 4px double var(--wood-dark);
    }

    .featured-art img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
      filter: sepia(0.1) contrast(1.03);
    }

    .featured-art-caption {
      position: absolute;
      right: 1rem;
      bottom: 1rem;
      left: 1rem;
      padding: 0.75rem;
      color: var(--parchment-pale);
      background: rgba(27, 15, 9, 0.84);
      border: 1px solid var(--gold);
      text-align: center;
    }

    .featured-copy {
      padding: clamp(1.4rem, 4vw, 3rem);
      align-self: center;
    }

    .featured-copy h2 {
      margin-bottom: 0.35rem;
      font-size: clamp(2rem, 5vw, 4rem);
    }

    .featured-subtitle {
      margin-bottom: 1.3rem;
      color: var(--ruby-dark);
      font-weight: 800;
      letter-spacing: 0.11em;
      text-transform: uppercase;
    }

    .quote-box {
      margin: 1.3rem 0;
      padding: 1rem 1.2rem;
      color: var(--ink-soft);
      background: rgba(255,255,255,0.24);
      border-left: 5px solid var(--ruby);
      font-size: 1.08rem;
      font-style: italic;
    }

    .character-facts {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0.65rem;
      margin: 1.2rem 0;
    }

    .fact-box {
      padding: 0.75rem;
      background: rgba(255,255,255,0.22);
      border: 1px solid rgba(75,46,29,0.4);
    }

    .fact-box dt {
      color: var(--ruby-dark);
      font-size: 0.7rem;
      font-weight: 900;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .fact-box dd {
      margin: 0.15rem 0 0;
      font-weight: 700;
    }

    .relationship-meter {
      margin-top: 1rem;
    }

    .relationship-meter label {
      display: flex;
      justify-content: space-between;
      margin-bottom: 0.35rem;
      font-weight: 800;
    }

    .meter-track {
      height: 14px;
      overflow: hidden;
      background: rgba(41, 24, 14, 0.18);
      border: 2px solid var(--wood-dark);
    }

    .meter-fill {
      width: 78%;
      height: 100%;
      background:
        repeating-linear-gradient(
          135deg,
          var(--ruby) 0 8px,
          var(--ruby-dark) 8px 16px
        );
      animation: meter-grow 1.5s ease-out both;
      transform-origin: left;
    }

    @keyframes meter-grow {
      from { transform: scaleX(0); }
      to { transform: scaleX(1); }
    }

    /* =========================================================
       13. TRAVEL NETWORK
       ========================================================= */

    .travel-layout {
      display: grid;
      grid-template-columns: minmax(0, 1.1fr) minmax(280px, 0.9fr);
      gap: 1rem;
    }

    .travel-map {
      position: relative;
      min-height: 530px;
      overflow: hidden;
      padding: 1rem;
      background:
        linear-gradient(rgba(245, 228, 185, 0.88), rgba(210, 177, 111, 0.9)),
        url("https://files.catbox.moe/example.jpg") center / cover;
      border: var(--border-medium) double var(--wood-dark);
    }

    .route-line {
      position: absolute;
      height: 4px;
      background:
        repeating-linear-gradient(
          to right,
          var(--ruby-dark) 0 12px,
          transparent 12px 20px
        );
      transform-origin: left center;
      opacity: 0.8;
    }

    .route-1 {
      width: 35%;
      top: 29%;
      left: 24%;
      transform: rotate(10deg);
    }

    .route-2 {
      width: 31%;
      top: 55%;
      left: 48%;
      transform: rotate(35deg);
    }

    .route-3 {
      width: 42%;
      top: 69%;
      left: 19%;
      transform: rotate(-12deg);
    }

    .route-4 {
      width: 27%;
      top: 38%;
      left: 14%;
      transform: rotate(71deg);
    }

    .route-node {
      position: absolute;
      z-index: 2;
      width: 92px;
      min-height: 72px;
      display: grid;
      place-items: center;
      padding: 0.45rem;
      color: var(--parchment-pale);
      background: var(--wood);
      border: 3px double var(--gold);
      border-radius: 50%;
      box-shadow: 0 7px 15px rgba(0,0,0,0.25);
      font-size: 0.78rem;
      font-weight: 800;
      text-align: center;
      text-transform: uppercase;
      transition:
        transform var(--transition-fast),
        background var(--transition-fast);
    }

    .route-node:hover {
      transform: scale(1.08);
      background: var(--ruby-dark);
    }

    .node-1 { top: 12%; left: 11%; }
    .node-2 { top: 22%; left: 50%; }
    .node-3 { top: 50%; left: 71%; }
    .node-4 { top: 69%; left: 35%; }
    .node-5 { top: 42%; left: 10%; }

    .travel-guide {
      padding: 1.2rem;
    }

    .travel-method {
      display: grid;
      grid-template-columns: 48px 1fr;
      gap: 0.8rem;
      align-items: start;
      padding: 0.8rem 0;
      border-bottom: 1px solid rgba(75,46,29,0.35);
    }

    .travel-method:last-child {
      border-bottom: 0;
    }

    .travel-method-icon {
      width: 48px;
      height: 48px;
      display: grid;
      place-items: center;
      color: var(--gold
